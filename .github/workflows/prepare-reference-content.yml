name: Prepare approved reference content
on:
  push:
    branches: [feature/reference-library-readers]
    paths: [.github/workflows/prepare-reference-content.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recreate supplied resource data
        run: |
          node prepare-reference-library.cjs
          node prepare-reference-resources.cjs
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const root='corpus/reference/derived/v2',names=[];
          function walk(folder){for(const d of fs.readdirSync(path.join(root,folder),{withFileTypes:true})){const f=folder?folder+'/'+d.name:d.name;if(d.isDirectory())walk(f);else names.push(f);}}
          walk('');names.sort();const h=crypto.createHash('sha256');let bytes=0;
          for(const file of names){const b=fs.readFileSync(path.join(root,file));bytes+=b.length;h.update(file+'\0'+crypto.createHash('sha256').update(b).digest('hex')+'\n');}
          const data={files:names.length,bytes,sha256:h.digest('hex')};
          fs.writeFileSync('REFERENCE-PACKAGE.json',JSON.stringify(data,null,2)+'\n');
          const catalog=JSON.parse(fs.readFileSync(root+'/catalog.json'));
          if(catalog.resources.length!==36||catalog.resources.filter(r=>r.readable).length!==29)throw Error('Unexpected resource outcomes');
          console.log(JSON.stringify(data));
          NODE
      - name: Commit converted content to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- corpus/reference/derived REFERENCE-INTEGRATION-LEDGER.json REFERENCE-PACKAGE.json
          git commit -m "Package validated reference content from preserved original modules"
          git push origin HEAD:feature/reference-library-readers
