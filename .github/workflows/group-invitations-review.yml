name: Review group invitation permissions
on:
  push:
    branches: [codex/group-invitations]
    paths:
      - 'tests/fellowship-pilot/group-invitations*'
      - 'tests/fellowship-pilot/emulator.cjs'
      - '.github/workflows/group-invitations-review.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/fellowship-pilot/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real rules against synthetic identities
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
        run: npx --yes firebase-tools@15.36.0 emulators:exec --project demo-homegroups-fellowship-pilot --config tests/fellowship-pilot/group-invitations-emulator.json --only firestore "node tests/fellowship-pilot/group-invitations-check.cjs"
