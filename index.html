<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111712">
<title>NextPhase · HomeGroups</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./theme.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="app">
  <header class="top"><div class="top-inner">
    <a class="brand" href="./" aria-label="HomeGroups, current study"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7c-3-3-7-3-9-2v13c3-1 6-1 9 2 3-3 6-3 9-2V5c-2-1-6-1-9 2v13"/></svg></span><span>HomeGroups<small>NextPhase</small></span></a>
    <div class="top-actions">
      <button id="theme-button" class="quiet appearance-button" type="button" data-open="themeManager" aria-label="Theme Manager" aria-haspopup="dialog" title="Theme Manager">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.1a1.7 1.7 0 0 0 1.1-3c-.7-.6-.3-1.8.6-1.8H17a4 4 0 0 0 4-4A9 9 0 0 0 12 3Z"/><path d="M8 9h.01M12 7h.01M16 9h.01M7 13h.01" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <button id="week-button" class="week-button" data-open="weeks">Choose week</button>
    </div>
  </div></header>
  <div id="stage" class="stage" data-face="study">
    <div id="turn" class="turn">
      <main id="study" class="face" aria-labelledby="study-title" tabindex="-1"><p class="loading" role="status">Opening this week’s study…</p></main>
      <section id="fellowship" class="face back" aria-labelledby="fellowship-title" tabindex="-1" inert aria-hidden="true"></section>
    </div>
  </div>
  <footer class="dock"><div class="dock-inner">
    <div class="player" id="player" hidden><div><strong id="playing"></strong><small id="audio-status" role="status"></small></div><audio id="audio" controls preload="none"></audio><button id="stop-audio" class="quiet" aria-label="Close player">Close</button></div>
    <nav aria-label="Weekly study actions">
      <button id="tools-button" data-open="tools">Tools</button>
      <button id="flip" class="flip" type="button" aria-pressed="false">Study discussion <span aria-hidden="true">⇄</span></button>
      <button id="notes-button" data-open="note">Notes</button>
      <button id="games-button" class="games-launch" type="button" hidden>Invite to Game</button>
    </nav>
  </div></footer>
</div>
<dialog id="dialog" aria-labelledby="panel-title">
  <div class="panel">
    <header class="panel-header"><button type="button" class="quiet" id="back" hidden>Back</button><div><p id="panel-kicker"></p><h2 id="panel-title" tabindex="-1"></h2></div><button class="quiet" id="expand" type="button" aria-pressed="false">Expand</button><button type="button" class="quiet" id="close">Close</button></header>
    <div id="panel-body" class="panel-body"></div>
  </div>
</dialog>
</body>
</html>
